apis:
- name: Revnu MCP Server
  description: A live remote MCP server over streamable HTTP that gives an AI assistant
    operator-level control of a Revnu store — 49 documented tools across store, products,
    coupons, analytics, purchases, affiliates, A/B tests, publishing, Stripe, Discord,
    assets and optimization. Authenticated with a dashboard-issued bearer API key (prefix
    rev_cli_ or rev_). Revnu publishes the endpoint as https://revnu.app/api/mcp, but
    that host 308-redirects to the marketing site where it 404s; the server that answers
    JSON-RPC is https://auth.revnu.app/api/mcp.
  humanURL: https://auth.revnu.app/docs/mcp
  baseURL: https://auth.revnu.app/api/mcp
  tags:
  - MCP
  - Agents
  - Commerce
  properties:
  - type: MCPServer
    url: mcp/revnu-mcp.yml
  - type: ToolCrosswalk
    url: mcp/revnu-tool-crosswalk.yml
  - type: Documentation
    url: https://auth.revnu.app/docs/mcp
  - type: Authentication
    url: authentication/revnu-authentication.yml
- name: Revnu Auth API
  description: The authentication API behind the @revnu/auth SDK, serving a Revnu store's
    buyers. Purchase-first — buying a product creates the account and sends a password
    setup link, so there is no separate sign-up flow. Identified by a publishable store
    key in the X-Revnu-Key header, and issuing RS256 JWTs whose claims embed the buyer's
    product entitlements, so access checks need no webhook and no callback.
  humanURL: https://auth.revnu.app/docs/auth-sdk
  baseURL: https://auth.revnu.app
  tags:
  - Authentication
  - SaaS
