name: Revnu
description: >-
  Revnu is an AI growth-automation platform for early-stage and technical
  founders, positioning itself as an "AI growth hire" that runs marketing work across
  channels so builders can stay in the codebase. The platform finds and qualifies leads
  from real signals, drafts cold outbound and partnership pitches, writes SEO content,
  runs paid ad experiments across Meta, LinkedIn, Reddit, and TikTok, turns product
  wins into short-form video and social posts, and tests pricing and landing-page copy.
  Founded in 2026 out of the Y Combinator Spring 2026 batch and based in San Francisco,
  Revnu is agent-first rather than API-first: it publishes no OpenAPI, but it does ship
  a live remote MCP server with a documented 49-tool surface, a first-party CLI, an
  authentication SDK for a customer's own app, an HMAC-signed webhook catalog, an RFC
  9727 api-catalog, and machine-readable llms.txt context files across its hosts.
