name: Revnu
description: Revnu is an AI-powered growth-automation platform for early-stage and technical
  founders, positioning itself as an "AI growth hire" that runs marketing work across
  channels so builders can stay in the codebase. The platform finds and qualifies leads
  from real signals, drafts cold outbound and partnership pitches, writes SEO content,
  runs paid ad experiments across Meta, LinkedIn, Reddit, and TikTok, turns product
  wins into short-form video and social posts, and tests pricing and landing-page copy,
  sending approvals and weekly recaps through iMessage, Slack, and email. Founded in
  2026 out of the Y Combinator Spring 2026 batch and based in San Francisco, Revnu is
  a SaaS product with a dashboard/agent interface rather than an API-first platform;
  it currently publishes no public developer API, but does expose machine-readable
  llms.txt context files for AI agents.
