note: >-
  Revnu publishes no error reference and no OpenAPI, so this catalogue is built
  from error responses observed live on the provider's own host, plus the error
  branches in the first-party @revnu/cli and @revnu/setup packages. The envelope
  is {"error": "...", "message": "..."} with `message` optional; there is no
  `type` URI, no `title`, and no application/problem+json media type, so agents
  must match on the literal `error` string.
