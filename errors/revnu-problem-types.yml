device_authorization_states:
  surface: POST /api/cli/device/poll
  source: npm @revnu/cli 0.1.0
  states:
  - state: pending
    meaning: user has not yet approved; keep polling at `interval`
  - state: approved
    meaning: returns accessToken + expiresAt
  - state: denied
    meaning: user rejected the authorization
  - state: expired
    meaning: device code lifetime elapsed; restart the flow
  - state: used
    meaning: device code already exchanged; restart the flow
  - state: invalid
    meaning: unknown device code
