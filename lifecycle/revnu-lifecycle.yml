  finding: >-
    Every URL Revnu publishes for its own API points at https://revnu.app, which
    308-redirects to the marketing site https://revnu.com, where every /api/*
    path returns the Next.js 404 HTML shell. The working host for the docs, the
    api-catalog, the MCP server card, the MCP endpoint, the /api/agent REST
    surface and the /api/auth Auth API is https://auth.revnu.app.
  affects:
  - the MCP endpoint in the docs, the server card and the api-catalog (https://revnu.app/api/mcp)
  - the copy-paste Cursor / Claude Code / Claude Desktop / Codex configs
  - the CLI's compiled default base (https://revnu.app) — `revnu auth login` fails
    unless REVNU_API_URL is overridden
  - the device-flow verification URL (https://revnu.app/cli/authorize)
  - the remediation URL in the 401 body (https://revnu.app/dashboard/settings)
  - every link in https://auth.revnu.app/llms.txt
