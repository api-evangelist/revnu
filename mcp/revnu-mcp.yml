deployment:
  mode: remote
  endpoint: https://auth.revnu.app/api/mcp
  published_endpoint: https://revnu.app/api/mcp
  auth: api-key
  verified: probed
  note: >-
    The endpoint Revnu publishes in its own docs, its MCP server card and its
    RFC 9727 api-catalog is https://revnu.app/api/mcp. That host 308-redirects
    every path to https://revnu.com, which returns a 404 HTML shell, so every
    copy-paste config in the docs (Cursor, Claude Code, Claude Desktop, Codex)
    fails as published. The server that actually answers MCP JSON-RPC is
    https://auth.revnu.app/api/mcp — an anonymous POST of tools/list there
    returns HTTP 401 {"code":-32001,"message":"Unauthorized: Missing or invalid
    Bearer token"}, i.e. a live, auth-gated MCP server.
server:
  name: revnu
  version: 1.0.0
  transport: streamable-http
  url: https://auth.revnu.app/api/mcp
  server_card: revnu-mcp-server-card.json
  description: Manage a Revnu store, products, A/B tests, SEO content, ads, coupons,
    affiliates, and analytics via MCP.
  capabilities:
    tools:
      listChanged: false
authentication:
  type: bearer
  header: Authorization
  scheme: Bearer
  key_prefixes:
  - rev_cli_
  - rev_
  issuer: Revnu dashboard, Dashboard -> CLI -> "API Keys & MCP"
  token_issuer_url: https://revnu.app/dashboard/cli
  note: tools/list is auth-gated, so tool inputSchemas could not be introspected;
    the tools below are the provider's own published tool reference (names and
    descriptions only).
tool_count_claimed:
  server_card: 50+ tools across 12 modules
  docs_markdown: 50 tools across 12 modules
  docs_html: 43 tools across 11 modules
  note: the provider's own three surfaces disagree on the count; 49 distinct tool
    names are actually enumerated in the docs tables captured below
